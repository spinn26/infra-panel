<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Infra Panel — Docker-сервер и сайты в одном окне">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14181d"/><stop offset="1" stop-color="#0f1014"/>
    </linearGradient>
    <radialGradient id="aur1" cx="230" cy="90" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3f6f64" stop-opacity=".75"/><stop offset=".5" stop-color="#2d4756" stop-opacity=".35"/><stop offset="1" stop-color="#2d4756" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aur2" cx="1120" cy="610" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5a4a84" stop-opacity=".7"/><stop offset=".55" stop-color="#36564e" stop-opacity=".25"/><stop offset="1" stop-color="#36564e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8e6c9"/><stop offset=".55" stop-color="#8ed1b0"/><stop offset="1" stop-color="#b4a7f5"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ed1b0"/><stop offset="1" stop-color="#9cc9e6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".085"/><stop offset="1" stop-color="#ffffff" stop-opacity=".035"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ed1b0" stop-opacity=".2"/><stop offset=".6" stop-color="#b4a7f5" stop-opacity=".08"/><stop offset="1" stop-color="#ffffff" stop-opacity=".03"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed1b0" stop-opacity=".32"/><stop offset="1" stop-color="#8ed1b0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb" cx=".35" cy=".3" r=".75">
      <stop offset="0" stop-color="#e3f4ea"/><stop offset=".45" stop-color="#7cc4a2"/><stop offset="1" stop-color="#4b8a70"/>
    </radialGradient>
    <linearGradient id="markbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2a26"/><stop offset="1" stop-color="#1d1b2c"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".55"/></filter>
    <clipPath id="screen"><rect x="600" y="92" width="620" height="470" rx="26"/></clipPath>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#aur1)"/>
  <rect width="1280" height="640" fill="url(#aur2)"/>
  <g stroke="#ffffff" stroke-opacity=".035">
    <path d="M0 160H1280M0 320H1280M0 480H1280M320 0V640M640 0V640M960 0V640"/>
  </g>

  <!-- логотип -->
  <g transform="translate(72 96)">
    <rect width="72" height="72" rx="22" fill="url(#markbg)"/>
    <rect x=".75" y=".75" width="70.5" height="70.5" rx="21.25" fill="none" stroke="url(#acc)" stroke-opacity=".5" stroke-width="1.5"/>
    <g transform="scale(1.5)">
      <path d="M24 34.5 11 28l4.2-2.1L24 30.3l8.8-4.4L37 28z" fill="none" stroke="#b4a7f5" stroke-opacity=".6" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M24 29.5 11 23l4.2-2.1L24 25.3l8.8-4.4L37 23z" fill="none" stroke="url(#acc)" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M24 11 37 17.5 24 24 11 17.5z" fill="url(#acc)"/>
      <circle cx="24" cy="17.5" r="2.3" fill="#13261d"/>
    </g>
  </g>
  <text x="164" y="142" font-family="Onest, 'Segoe UI', Inter, system-ui, sans-serif" font-size="30" font-weight="600" fill="#eceae4">Infra Panel</text>

  <!-- заголовок -->
  <text font-family="Onest, 'Segoe UI', Inter, system-ui, sans-serif" font-weight="700" fill="#eceae4" letter-spacing="-1.5">
    <tspan x="72" y="262" font-size="46">Docker-сервер</tspan>
    <tspan x="72" y="318" font-size="46">и сайты в одном окне</tspan>
  </text>
  <text font-family="Onest, 'Segoe UI', Inter, system-ui, sans-serif" font-size="20" fill="#9a9ca6">
    <tspan x="72" y="378">Контейнеры, метрики, бэкапы в S3 и сайты</tspan>
    <tspan x="72" y="406">на WordPress, Битрикс и ещё 9 шаблонах.</tspan>
  </text>

  <!-- преимущества -->
  <g font-family="Onest, 'Segoe UI', Inter, system-ui, sans-serif" font-size="15" fill="#eceae4">
    <rect x="72" y="446" width="176" height="40" rx="20" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".1"/>
    <circle cx="94" cy="466" r="4" fill="#8ed1b0"/><text x="108" y="471">Без зависимостей</text>
    <rect x="258" y="446" width="166" height="40" rx="20" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".1"/>
    <circle cx="280" cy="466" r="4" fill="#b4a7f5"/><text x="294" y="471">Один контейнер</text>
    <rect x="72" y="496" width="186" height="40" rx="20" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".1"/>
    <circle cx="94" cy="516" r="4" fill="#e9c27a"/><text x="108" y="521">Установка за 2 мин</text>
  </g>
  <text x="72" y="590" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" fill="#8ed1b0">$ docker compose up -d --build</text>

  <!-- макет панели -->
  <g filter="url(#soft)">
    <rect x="600" y="92" width="620" height="470" rx="26" fill="#1b1d23" fill-opacity=".86"/>
  </g>
  <g clip-path="url(#screen)">
    <rect x="600" y="92" width="620" height="470" fill="url(#glass)"/>
    <!-- боковое меню -->
    <rect x="616" y="108" width="132" height="438" rx="18" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".08"/>
    <g transform="translate(630 122) scale(.62)">
      <rect width="48" height="48" rx="14" fill="url(#markbg)"/>
      <path d="M24 29.5 11 23l4.2-2.1L24 25.3l8.8-4.4L37 23z" fill="none" stroke="url(#acc)" stroke-width="1.6"/>
      <path d="M24 11 37 17.5 24 24 11 17.5z" fill="url(#acc)"/>
    </g>
    <rect x="666" y="128" width="62" height="8" rx="4" fill="#eceae4" fill-opacity=".8"/>
    <rect x="666" y="142" width="44" height="6" rx="3" fill="#9a9ca6" fill-opacity=".6"/>
    <rect x="626" y="172" width="112" height="28" rx="10" fill="#8ed1b0" fill-opacity=".15" stroke="#8ed1b0" stroke-opacity=".3"/>
    <circle cx="642" cy="186" r="5" fill="none" stroke="#8ed1b0" stroke-width="1.6"/>
    <rect x="654" y="182" width="50" height="8" rx="4" fill="#eceae4"/>
    <g fill="#9a9ca6" fill-opacity=".5">
      <circle cx="642" cy="218" r="5"/><rect x="654" y="214" width="66" height="7" rx="3.5"/>
      <circle cx="642" cy="246" r="5"/><rect x="654" y="242" width="46" height="7" rx="3.5"/>
      <circle cx="642" cy="274" r="5"/><rect x="654" y="270" width="56" height="7" rx="3.5"/>
      <circle cx="642" cy="302" r="5"/><rect x="654" y="298" width="40" height="7" rx="3.5"/>
      <circle cx="642" cy="330" r="5"/><rect x="654" y="326" width="52" height="7" rx="3.5"/>
      <circle cx="642" cy="358" r="5"/><rect x="654" y="354" width="60" height="7" rx="3.5"/>
    </g>

    <!-- главный блок -->
    <rect x="762" y="108" width="442" height="92" rx="20" fill="url(#hero)" stroke="#8ed1b0" stroke-opacity=".3"/>
    <circle cx="802" cy="154" r="22" fill="#8ed1b0" opacity=".45" filter="url(#glow)"/>
    <circle cx="802" cy="154" r="20" fill="url(#orb)"/>
    <text x="838" y="150" font-family="Onest, 'Segoe UI', Inter, system-ui, sans-serif" font-size="21" font-weight="700" fill="#eceae4">Всё работает</text>
    <text x="838" y="174" font-family="Onest, 'Segoe UI', Inter, system-ui, sans-serif" font-size="12.5" fill="#9a9ca6">10 из 10 контейнеров · 12 сайтов отвечают</text>

    <!-- карточки -->
    <g font-family="'JetBrains Mono', Consolas, monospace">
      <rect x="762" y="214" width="138" height="104" rx="16" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".09"/>
      <text x="778" y="240" font-family="Onest, 'Segoe UI', sans-serif" font-size="12" fill="#9a9ca6">Контейнеры</text>
      <text x="778" y="278" font-size="30" font-weight="600" fill="#eceae4">10<tspan font-size="15" fill="#9a9ca6"> / 10</tspan></text>
      <rect x="778" y="296" width="106" height="6" rx="3" fill="#ffffff" fill-opacity=".08"/>
      <rect x="778" y="296" width="106" height="6" rx="3" fill="url(#btn)"/>

      <rect x="914" y="214" width="138" height="104" rx="16" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".09"/>
      <text x="930" y="240" font-family="Onest, 'Segoe UI', sans-serif" font-size="12" fill="#9a9ca6">Процессор</text>
      <text x="930" y="278" font-size="30" font-weight="600" fill="#eceae4">23%</text>
      <rect x="930" y="296" width="106" height="6" rx="3" fill="#ffffff" fill-opacity=".08"/>
      <rect x="930" y="296" width="26" height="6" rx="3" fill="url(#btn)"/>

      <rect x="1066" y="214" width="138" height="104" rx="16" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".09"/>
      <text x="1082" y="240" font-family="Onest, 'Segoe UI', sans-serif" font-size="12" fill="#9a9ca6">Память</text>
      <text x="1082" y="278" font-size="30" font-weight="600" fill="#eceae4">54%</text>
      <rect x="1082" y="296" width="106" height="6" rx="3" fill="#ffffff" fill-opacity=".08"/>
      <rect x="1082" y="296" width="58" height="6" rx="3" fill="#b4a7f5"/>
    </g>

    <!-- график -->
    <rect x="762" y="332" width="290" height="214" rx="18" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="780" y="360" font-family="Onest, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#eceae4">Нагрузка за 24 часа</text>
    <g stroke="#ffffff" stroke-opacity=".06"><path d="M778 410H1036M778 452H1036M778 494H1036"/></g>
    <path d="M778 480C800 470 812 446 834 452S866 488 890 470 922 418 946 428 980 470 1004 448 1024 420 1036 424V530H778Z" fill="url(#area)"/>
    <path d="M778 480C800 470 812 446 834 452S866 488 890 470 922 418 946 428 980 470 1004 448 1024 420 1036 424" fill="none" stroke="#8ed1b0" stroke-width="3" stroke-linecap="round"/>
    <path d="M778 404C810 400 840 408 870 402S930 396 960 400 1010 394 1036 398" fill="none" stroke="#b4a7f5" stroke-width="2.4" stroke-linecap="round" stroke-opacity=".9"/>

    <!-- кольцо -->
    <rect x="1066" y="332" width="138" height="214" rx="18" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".08"/>
    <circle cx="1135" cy="432" r="44" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="9"/>
    <circle cx="1135" cy="432" r="44" fill="none" stroke="url(#btn)" stroke-width="9" stroke-linecap="round" stroke-dasharray="150 277" transform="rotate(135 1135 432)"/>
    <text x="1135" y="440" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="22" font-weight="600" fill="#eceae4">54%</text>
    <text x="1135" y="512" text-anchor="middle" font-family="Onest, 'Segoe UI', sans-serif" font-size="12" fill="#9a9ca6">RAM</text>
  </g>
  <rect x="600.5" y="92.5" width="619" height="469" rx="25.5" fill="none" stroke="#ffffff" stroke-opacity=".12"/>
</svg>
